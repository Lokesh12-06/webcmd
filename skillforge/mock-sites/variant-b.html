<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TechScale Inc - Career Portal (Variant B)</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: #111827; color: #f9fafb; padding: 40px; display: flex; justify-content: center; }
    .container { background: #1f2937; border-radius: 16px; padding: 36px; width: 100%; max-width: 550px; border: 1px solid #374151; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    h1 { color: #f43f5e; font-size: 1.6rem; margin-bottom: 8px; }
    .subtitle { color: #9ca3af; font-size: 0.875rem; margin-bottom: 24px; }
    .input-field { margin-bottom: 18px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: #d1d5db; margin-bottom: 6px; }
    input[type="text"], input[type="email"], input[type="number"], input[type="file"] { width: 100%; padding: 12px; background: #111827; border: 1px solid #4b5563; border-radius: 8px; color: #fff; box-sizing: border-box; }
    .action-btn { background: #e11d48; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 12px; font-size: 1rem; }
    .action-btn:hover { background: #be123c; }
    .success { display: none; margin-top: 20px; padding: 16px; background: #064e3b; border: 1px solid #059669; color: #6ee7b7; border-radius: 8px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>TechScale Inc - Apply Now</h1>
    <div class="subtitle">Variant B: Relabeled Fields & Flex Layout</div>
    <form id="techscale-form">
      <div class="input-field">
        <label for="applicant_name">Applicant Name</label>
        <input type="text" id="applicant_name" name="applicant_name" placeholder="Full name" required>
      </div>
      <div class="input-field">
        <label for="contact_email">Contact Email</label>
        <input type="email" id="contact_email" name="contact_email" placeholder="email@domain.com" required>
      </div>
      <div class="input-field">
        <label for="cv_file">Upload CV Document</label>
        <input type="file" id="cv_file" name="cv_file">
      </div>
      <div class="input-field">
        <label for="experience_years">Years in Industry</label>
        <input type="number" id="experience_years" name="experience_years" value="3">
      </div>
      <button type="submit" id="btn-apply-now" class="action-btn">Apply Now</button>
    </form>
    <div id="success-banner" class="success">Application Submitted Successfully!</div>
  </div>

  <script>
    document.getElementById('techscale-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('success-banner').style.display = 'block';
    });
  </script>
</body>
</html>
