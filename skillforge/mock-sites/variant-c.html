<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apex Global Solutions - Job Application (Variant C)</title>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #070a12; color: #e2e8f0; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .box { background: rgba(15, 23, 42, 0.8); border-radius: 18px; padding: 38px; width: 100%; max-width: 530px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.6); backdrop-filter: blur(12px); }
    h2 { color: #818cf8; margin-top: 0; font-size: 1.7rem; font-weight: 800; }
    .subtitle { color: #64748b; font-size: 0.88rem; margin-bottom: 24px; }
    .field-wrap { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #a5b4fc; font-size: 0.88rem; }
    input[type="text"], input[type="email"], input[type="number"], input[type="file"] { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 0.95rem; }
    input:focus { border-color: #818cf8; outline: none; }
    .submit-cta { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); transition: all 0.2s; }
    .submit-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6); }
    .success { display: none; margin-top: 24px; padding: 16px; background: rgba(52, 211, 153, 0.15); border: 1px solid #10b981; color: #6ee7b7; border-radius: 10px; text-align: center; font-weight: 700; font-size: 1.05rem; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Apex Global - Candidate Portal</h2>
    <div class="subtitle">Benchmark Variant C: Re-ordered Fields (Experience & Resume First)</div>
    <form id="apex-form">
      <div class="field-wrap">
        <label for="exp">Experience (Years)</label>
        <input type="number" id="exp" name="exp" value="4" min="0">
      </div>
      <div class="field-wrap">
        <label for="resumeDoc">Upload Resume (PDF/DOC)</label>
        <input type="file" id="resumeDoc" name="resumeDoc">
      </div>
      <div class="field-wrap">
        <label for="yourName">Your Full Name</label>
        <input type="text" id="yourName" name="yourName" placeholder="Full name" required>
      </div>
      <div class="field-wrap">
        <label for="emailAddr">Email Address</label>
        <input type="email" id="emailAddr" name="emailAddr" placeholder="email@example.com" required>
      </div>
      <button type="submit" id="btn-send-app" class="submit-cta">Send My Application</button>
    </form>
    <div id="success-banner" class="success">&check; Application Submitted Successfully!</div>
  </div>

  <script>
    document.getElementById('apex-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('success-banner').style.display = 'block';
    });
  </script>
</body>
</html>
