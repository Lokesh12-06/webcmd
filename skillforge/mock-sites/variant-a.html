<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Acme Corp - Career Portal (Variant A)</title>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #070a12; color: #f8fafc; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .card { background: rgba(15, 23, 42, 0.8); border-radius: 16px; padding: 36px; width: 100%; max-width: 520px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(12px); }
    h2 { margin-top: 0; color: #38bdf8; font-size: 1.6rem; font-weight: 800; }
    .subtitle { color: #64748b; font-size: 0.88rem; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; font-size: 0.88rem; }
    input[type="text"], input[type="email"], input[type="number"], input[type="file"] { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #334155; border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 0.95rem; }
    input:focus { border-color: #38bdf8; outline: none; }
    button { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6); }
    .success { display: none; margin-top: 24px; padding: 16px; background: rgba(52, 211, 153, 0.15); border: 1px solid #10b981; color: #6ee7b7; border-radius: 10px; text-align: center; font-weight: 700; font-size: 1.05rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Acme Corp - Career Application</h2>
    <div class="subtitle">Benchmark Variant A: Standard Layout</div>
    <form id="app-form">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Alex Morgan" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="alex@example.com" required>
      </div>
      <div class="form-group">
        <label for="resume">Resume / CV Document</label>
        <input type="file" id="resume" name="resume">
      </div>
      <div class="form-group">
        <label for="yearsExperience">Years of Experience</label>
        <input type="number" id="yearsExperience" name="yearsExperience" value="5" min="0" max="40">
      </div>
      <button type="submit" id="btn-submit">Submit Application</button>
    </form>
    <div id="success-banner" class="success">&check; Application Submitted & Recorded!</div>
  </div>

  <script>
    document.getElementById('app-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const exp = document.getElementById('yearsExperience').value;

      try {
        await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ variant: 'Variant A', fullName, email, exp })
        });
      } catch (err) {}

      document.getElementById('success-banner').style.display = 'block';
    });
  </script>
</body>
</html>
